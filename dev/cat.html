<!doctype html><html><head><meta charset="utf-8"><title>cat lookdev</title>
<style>html,body{margin:0;height:100%;background:#888}canvas{width:100%;height:100%;display:block}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script></head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from '../vendor/addons/RoomEnvironment.js';
import { Cat, COATS } from '../js/cat.js';
import { loadCatAssets } from '../js/catmodel.js';
const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas, antialias: true });
r.setSize(innerWidth, innerHeight, false); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xb8c4d0);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const sun = new THREE.DirectionalLight(0xfff0dc, 2.6); sun.position.set(2, 4, 2.5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: .5, far: 12 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.01;
scene.add(sun);
const fl = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x9a8570, roughness: .8 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; scene.add(fl);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .02, 50);
const assets = await loadCatAssets('../assets/cat/');
const q = new URLSearchParams(location.search);
const cat = new Cat(scene, assets, COATS[+(q.get('coat') || 0)]);
const world = { resolveXZ: () => 0, groundAt: () => ({ y: 0, box: null }), ceilingAt: () => Infinity };
const ctl = { mx: 0, mz: 0, jump: false, jumpPressed: false, pawPressed: false, pawHeld: false, meowPressed: false };
window.T = {
  cat, ctl, COATS, scene, r, THREE,
  step(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) { cat.update(dt, ctl, world); ctl.jumpPressed = ctl.pawPressed = ctl.meowPressed = false; } },
  cam(yaw, pitch, dist, ty = .3) { const t = new THREE.Vector3(cat.pos.x, cat.pos.y + ty, cat.pos.z); const cp = Math.cos(pitch);
    cam.position.set(t.x + Math.sin(yaw) * cp * dist, t.y + Math.sin(pitch) * dist, t.z + Math.cos(yaw) * cp * dist); cam.lookAt(t); r.render(scene, cam); },
  reset() { cat.teleport(0, 0, 0, 0); Object.assign(ctl, { mx: 0, mz: 0, jump: false, pawHeld: false }); cat.idle = 0; },
};
T.step(2); T.cam(.6, .15, 1.6);
document.title = 'ready';
</script></body></html>
